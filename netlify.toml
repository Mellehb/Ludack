[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

# SPA fallback — alle niet-API routes naar index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
